    - generic [ref=f16e48]:
      - generic [ref=f16e49]:
        - generic [ref=f16e50]: Quiénes somos
        - heading "¿Quiénes somos?" [level=2] [ref=f16e51]
      - generic [ref=f16e52]:
        - generic [ref=f16e53]:
          - paragraph [ref=f16e54]: Ossinova Surgical Group es una empresa fundada en Elche (Alicante) por Jesús Agulló y Raquel Fernández, veterinarios clínicos en activo, dedicados a la medicina interna, cirugía, traumatología y neurocirugía de pequeños animales en un hospital veterinario.
          - paragraph [ref=f16e55]: Ossinova nace directamente del quirófano, de la experiencia diaria, con el objetivo de desarrollar y ofrecer soluciones que respondan a las necesidades prácticas del cirujano veterinario. Cada producto que ofrecemos está pensado desde la perspectiva clínica, priorizando la funcionalidad, la fiabilidad y la facilidad de uso en el trabajo diario.
          - paragraph [ref=f16e56]: Ofrecemos una gama completa de implantes y tornillos fabricados en titanio Ti-6Al-4V ELI (grado 23), desarrollados para proporcionar resistencia, ligereza y biocompatibilidad. Nuestro catálogo incluye todo tipo de instrumental quirúrgico y motores autoclavables tanto para traumatología como para neurocirugía.
        - complementary [ref=f16e57]:
          - heading "Nuestro objetivo" [level=3] [ref=f16e58]
          - paragraph [ref=f16e59]: Cubrir las necesidades de los veterinarios con diferentes opciones, orientado a todo tipo de cirujanos veterinarios de clínica, hospital o ambulantes, independientemente de su volumen de actividad.
          - list [ref=f16e60]:
