      - generic [ref=f50e48]:
        - generic [ref=f50e49]: Quiénes somos
        - heading "¿Quiénes somos?" [level=2] [ref=f50e50]
      - generic [ref=f50e51]:
        - generic [ref=f50e52]:
          - paragraph [ref=f50e53]: Ossinova Surgical Group es una empresa fundada en Elche (Alicante) por Jesús Agulló y Raquel Fernández, veterinarios clínicos en activo, dedicados a la medicina interna, cirugía, traumatología y neurocirugía de pequeños animales en un hospital veterinario.
          - paragraph [ref=f50e54]: Ossinova nace directamente del quirófano, de la experiencia diaria, con el objetivo de desarrollar y ofrecer soluciones que respondan a las necesidades prácticas del cirujano veterinario. Cada producto que ofrecemos está pensado desde la perspectiva clínica, priorizando la funcionalidad, la fiabilidad y la facilidad de uso en el trabajo diario.
          - paragraph [ref=f50e55]: Ofrecemos una gama completa de implantes y tornillos fabricados en titanio Ti-6Al-4V ELI (grado 23), desarrollados para proporcionar resistencia, ligereza y biocompatibilidad. Nuestro catálogo incluye todo tipo de instrumental quirúrgico y motores autoclavables tanto para traumatología como para neurocirugía.
        - complementary [ref=f50e56]:
          - heading "Nuestro objetivo" [level=3] [ref=f50e57]
          - paragraph [ref=f50e58]: Cubrir las necesidades de los veterinarios con diferentes opciones, orientado a todo tipo de cirujanos veterinarios de clínica, hospital o ambulantes, independientemente de su volumen de actividad.
