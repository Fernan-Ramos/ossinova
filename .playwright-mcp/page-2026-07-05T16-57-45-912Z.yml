    - generic [ref=f22e70]:
      - generic [ref=f22e71]:
        - generic [ref=f22e72]: Quiénes somos
        - heading "¿Quiénes somos?" [level=2] [ref=f22e73]
      - generic [ref=f22e74]:
        - generic [ref=f22e75]:
          - paragraph [ref=f22e76]: Ossinova Surgical Group es una empresa fundada en Elche (Alicante) por Jesús Agulló y Raquel Fernández, veterinarios clínicos en activo, dedicados a la medicina interna, cirugía, traumatología y neurocirugía de pequeños animales en un hospital veterinario.
          - paragraph [ref=f22e77]: Ossinova nace directamente del quirófano, de la experiencia diaria, con el objetivo de desarrollar y ofrecer soluciones que respondan a las necesidades prácticas del cirujano veterinario. Cada producto que ofrecemos está pensado desde la perspectiva clínica, priorizando la funcionalidad, la fiabilidad y la facilidad de uso en el trabajo diario.
          - paragraph [ref=f22e78]: Ofrecemos una gama completa de implantes y tornillos fabricados en titanio Ti-6Al-4V ELI (grado 23), desarrollados para proporcionar resistencia, ligereza y biocompatibilidad. Nuestro catálogo incluye todo tipo de instrumental quirúrgico y motores autoclavables tanto para traumatología como para neurocirugía.
        - complementary [ref=f22e79]:
          - heading "Nuestro objetivo" [level=3] [ref=f22e80]
          - paragraph [ref=f22e81]: Cubrir las necesidades de los veterinarios con diferentes opciones, orientado a todo tipo de cirujanos veterinarios de clínica, hospital o ambulantes, independientemente de su volumen de actividad.
          - list [ref=f22e82]:
            - listitem [ref=f22e83]:
